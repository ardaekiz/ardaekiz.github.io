<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#FDFBF7">
  <title>Senin İçin Papatya Falı 🌼</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&family=Playfair+Display:ital,wght@0,600;1,400;1,600&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-main: #FDFBF7;
      --bg-card: #F7F1E5;
      --yellow: #F4C95D;
      --coral: #E8998D;
      --sage: #8DA399;
      --text: #3D352E;
      --text-light: #6B5F54;
      --white: #ffffff;
      --shadow-soft: 0 4px 24px rgba(61, 53, 46, 0.08);
      --shadow-hover: 0 8px 32px rgba(61, 53, 46, 0.14);
      --radius: 20px;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-main);
      color: var(--text);
      min-height: 100dvh;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 1.5rem 1rem 2rem;
      position: relative;
    }

    /* Üst Başlık & İpucu */
    .header-area {
      text-align: center;
      max-width: 420px;
      margin-top: 0.5rem;
    }

    .title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.4rem, 4.5vw, 1.85rem);
      font-weight: 600;
      color: var(--text);
      margin-bottom: 0.4rem;
    }

    .subtitle {
      font-family: 'Caveat', cursive;
      font-size: 1.15rem;
      color: var(--text-light);
    }

    /* Fal Mesaj Alanı */
    .message-container {
      width: 100%;
      max-width: 380px;
      min-height: 72px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0.8rem 0;
      text-align: center;
      padding: 0.5rem 1rem;
    }

    .fortune-message {
      font-family: 'Caveat', cursive;
      font-size: 1.45rem;
      font-weight: 600;
      color: var(--text);
      line-height: 1.4;
      background: var(--bg-card);
      padding: 0.8rem 1.4rem;
      border-radius: 24px;
      box-shadow: var(--shadow-soft);
      border-left: 3.5px solid var(--coral);
      border-right: 3.5px solid var(--yellow);
      animation: popIn 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes popIn {
      0% { transform: scale(0.85); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    /* Papatya Alanı */
    .daisy-stage {
      position: relative;
      width: min(340px, 86vw);
      height: min(340px, 86vw);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: auto 0;
      user-select: none;
      -webkit-user-select: none;
    }

    .daisy-svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    /* Koparılabilir Yapraklar */
    .petal {
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: filter 0.25s ease;
    }

    .petal:hover {
      filter: drop-shadow(0 0 8px rgba(244, 201, 93, 0.7));
    }

    /* Kopup Düşme Animasyonu:
       Her yaprak kendi transform-origin merkezinden kendi ekseni boyunca dışarı fırlayıp aşağı süzülür */
    .petal.falling {
      pointer-events: none;
      animation: petalPluck 1.2s cubic-bezier(0.2, 0.8, 0.4, 1) forwards;
    }

    @keyframes petalPluck {
      0% {
        opacity: 1;
        transform: rotate(var(--rot)) translateY(0) scale(1);
      }
      30% {
        opacity: 0.95;
        transform: rotate(var(--rot)) translateY(-25px) scale(1.05);
      }
      70% {
        opacity: 0.6;
        transform: rotate(var(--rot)) translateY(80px) rotate(18deg) scale(0.9);
      }
      100% {
        opacity: 0;
        transform: rotate(var(--rot)) translateY(220px) rotate(40deg) scale(0.5);
      }
    }

    /* Sarı Merkez (Göbek) */
    .daisy-center {
      transform-origin: 170px 170px;
      transition: all 0.5s ease;
      cursor: default;
      pointer-events: none;
    }

    .daisy-center.golden-glow {
      animation: centerGlow 1.8s ease-in-out infinite alternate;
    }

    .daisy-center.zoom-grow {
      animation: centerGrowMorph 0.8s cubic-bezier(0.34, 1.3, 0.64, 1) forwards;
    }

    @keyframes centerGlow {
      0% {
        filter: drop-shadow(0 0 10px rgba(244, 201, 93, 0.6));
        transform: scale(1);
      }
      100% {
        filter: drop-shadow(0 0 24px rgba(244, 201, 93, 0.95)) drop-shadow(0 0 10px rgba(232, 153, 141, 0.6));
        transform: scale(1.15);
      }
    }

    @keyframes centerGrowMorph {
      0% {
        transform: scale(1);
        opacity: 1;
        filter: drop-shadow(0 0 12px rgba(244, 201, 93, 0.8));
      }
      50% {
        transform: scale(1.6);
        opacity: 0.85;
        filter: drop-shadow(0 0 30px rgba(244, 201, 93, 1)) drop-shadow(0 0 15px rgba(232, 153, 141, 0.8));
      }
      100% {
        transform: scale(2.2);
        opacity: 0;
        filter: drop-shadow(0 0 40px rgba(244, 201, 93, 0));
      }
    }

    /* ══════════════════════════════════════════
       FİNAL SAHNESİ: POLAROİD FOTOĞRAF ALANI
       ══════════════════════════════════════════ */
    .photo-reveal-container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.12);
      opacity: 0;
      pointer-events: none;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: transform 0.9s cubic-bezier(0.34, 1.5, 0.64, 1), opacity 0.6s ease;
      width: min(280px, 80vw);
      max-width: 280px;
    }

    .photo-reveal-container.revealed {
      transform: translate(-50%, -50%) scale(1);
      opacity: 1;
      pointer-events: auto;
    }

    /* Şık Polaroid / Yumuşak Köşeli Çerçeve */
    .polaroid-frame {
      background: #FFFFFF;
      padding: 10px 10px 14px 10px;
      border-radius: 18px;
      box-shadow: 0 10px 32px rgba(61, 53, 46, 0.16),
                  0 0 32px rgba(244, 201, 93, 0.45),
                  0 0 18px rgba(232, 153, 141, 0.4); /* Sıcak altın/mercan parlama efekti */
      width: 100%;
      max-width: 280px;
      display: flex;
      flex-direction: column;
      align-items: center;
      border: 1.5px solid rgba(244, 201, 93, 0.35);
      animation: gentleFrameSway 4s ease-in-out infinite alternate;
    }

    @keyframes gentleFrameSway {
      0% { transform: rotate(-1.5deg); }
      100% { transform: rotate(1.5deg); }
    }

    .polaroid-img-wrap {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 12px;
      overflow: hidden;
      background: #F7F1E5;
      position: relative;
    }

    .polaroid-photo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
    }

    /* Kalan Yaprak Sayacı */
    .petal-counter {
      font-size: 0.88rem;
      color: var(--sage);
      font-weight: 500;
      margin-bottom: 0.5rem;
      transition: opacity 0.3s;
    }

    /* Sonuç Kartı (Fotoğrafın altında beliren alan) */
    .result-box {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 0.6rem;
      text-align: center;
      max-width: 360px;
      animation: fadeInUp 0.8s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      margin-top: 0.8rem;
      margin-bottom: 0.5rem;
      z-index: 25;
    }

    .result-box.show {
      display: flex;
    }

    @keyframes fadeInUp {
      0% { opacity: 0; transform: translateY(18px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    .result-text {
      font-family: 'Caveat', cursive;
      font-size: clamp(1.6rem, 5.5vw, 2.1rem);
      font-weight: 700;
      color: #D4786B;
      letter-spacing: 0.01em;
      line-height: 1.3;
      text-shadow: 0 2px 10px rgba(232, 153, 141, 0.3);
    }

    /* Alt Butonlar */
    .bottom-actions {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.8rem;
      margin-top: 0.5rem;
      z-index: 25;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.7rem 1.6rem;
      background: var(--bg-card);
      color: var(--text);
      text-decoration: none;
      border-radius: 25px;
      font-size: 0.95rem;
      font-weight: 600;
      box-shadow: var(--shadow-soft);
      border: 1.5px solid rgba(244, 201, 93, 0.4);
      transition: all 0.3s;
      -webkit-tap-highlight-color: transparent;
    }

    .back-btn:hover {
      background: #FFF3DF;
      border-color: var(--yellow);
      transform: translateY(-2px);
      box-shadow: var(--shadow-hover);
    }

    /* Uçuşan Kalpler Canvas */
    #heartCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 99;
      opacity: 0;
      transition: opacity 0.8s ease;
    }

    #heartCanvas.active {
      opacity: 1;
    }
  </style>
</head>
<body>

  <!-- Canvas: Bitişte uçuşan kalpler -->
  <canvas id="heartCanvas"></canvas>

  <!-- Üst Başlık -->
  <header class="header-area">
    <h1 class="title">Senin İçin Sürpriz.🌼</h1>
    <p class="subtitle" id="instructionText">Yapraklara tek tek dokun ve kopar...</p>
  </header>

  <!-- Fal Mesajı -->
  <div class="message-container">
    <div class="fortune-message" id="fortuneMessage">Bir yaprak seç 🤍</div>
  </div>

  <!-- Papatya SVG Sahnesi (340x340, Merkez 170,170) -->
  <div class="daisy-stage" id="daisyStage">
    <svg class="daisy-svg" viewBox="0 0 340 340" xmlns="http://www.w3.org/2000/svg">
      <!-- 12 Adet Tam Simetrik 30 Derece Aralıklarla Dizilmiş Koparılabilir Yaprak -->
      <g id="petalsGroup">
        <!-- Yaprak 1 (0°) -->
        <g class="petal" data-index="0" style="--rot: 0deg;" transform="rotate(0 170 170)">
          <!-- Oval damla formunda yaprak: alt ucu merkeze (170,170) iner, sarı göbeğin altında kaybolur -->
          <path d="M170 170 C150 115 146 50 170 12 C194 50 190 115 170 170 Z" fill="#FFFDF9" stroke="#EFE4D2" stroke-width="1.2"/>
          <path d="M170 40 L170 120" stroke="#ECE0CD" stroke-width="0.8" stroke-linecap="round"/>
        </g>
        <!-- Yaprak 2 (30°) -->
        <g class="petal" data-index="1" style="--rot: 30deg;" transform="rotate(30 170 170)">
          <path d="M170 170 C150 115 146 50 170 12 C194 50 190 115 170 170 Z" fill="#FFFDF9" stroke="#EFE4D2" stroke-width="1.2"/>
          <path d="M170 40 L170 120" stroke="#ECE0CD" stroke-width="0.8" stroke-linecap="round"/>
        </g>
        <!-- Yaprak 3 (60°) -->
        <g class="petal" data-index="2" style="--rot: 60deg;" transform="rotate(60 170 170)">
          <path d="M170 170 C150 115 146 50 170 12 C194 50 190 115 170 170 Z" fill="#FFFDF9" stroke="#EFE4D2" stroke-width="1.2"/>
          <path d="M170 40 L170 120" stroke="#ECE0CD" stroke-width="0.8" stroke-linecap="round"/>
        </g>
        <!-- Yaprak 4 (90°) -->
        <g class="petal" data-index="3" style="--rot: 90deg;" transform="rotate(90 170 170)">
          <path d="M170 170 C150 115 146 50 170 12 C194 50 190 115 170 170 Z" fill="#FFFDF9" stroke="#EFE4D2" stroke-width="1.2"/>
          <path d="M170 40 L170 120" stroke="#ECE0CD" stroke-width="0.8" stroke-linecap="round"/>
        </g>
        <!-- Yaprak 5 (120°) -->
        <g class="petal" data-index="4" style="--rot: 120deg;" transform="rotate(120 170 170)">
          <path d="M170 170 C150 115 146 50 170 12 C194 50 190 115 170 170 Z" fill="#FFFDF9" stroke="#EFE4D2" stroke-width="1.2"/>
          <path d="M170 40 L170 120" stroke="#ECE0CD" stroke-width="0.8" stroke-linecap="round"/>
        </g>
        <!-- Yaprak 6 (150°) -->
        <g class="petal" data-index="5" style="--rot: 150deg;" transform="rotate(150 170 170)">
          <path d="M170 170 C150 115 146 50 170 12 C194 50 190 115 170 170 Z" fill="#FFFDF9" stroke="#EFE4D2" stroke-width="1.2"/>
          <path d="M170 40 L170 120" stroke="#ECE0CD" stroke-width="0.8" stroke-linecap="round"/>
        </g>
        <!-- Yaprak 7 (180°) -->
        <g class="petal" data-index="6" style="--rot: 180deg;" transform="rotate(180 170 170)">
          <path d="M170 170 C150 115 146 50 170 12 C194 50 190 115 170 170 Z" fill="#FFFDF9" stroke="#EFE4D2" stroke-width="1.2"/>
          <path d="M170 40 L170 120" stroke="#ECE0CD" stroke-width="0.8" stroke-linecap="round"/>
        </g>
        <!-- Yaprak 8 (210°) -->
        <g class="petal" data-index="7" style="--rot: 210deg;" transform="rotate(210 170 170)">
          <path d="M170 170 C150 115 146 50 170 12 C194 50 190 115 170 170 Z" fill="#FFFDF9" stroke="#EFE4D2" stroke-width="1.2"/>
          <path d="M170 40 L170 120" stroke="#ECE0CD" stroke-width="0.8" stroke-linecap="round"/>
        </g>
        <!-- Yaprak 9 (240°) -->
        <g class="petal" data-index="8" style="--rot: 240deg;" transform="rotate(240 170 170)">
          <path d="M170 170 C150 115 146 50 170 12 C194 50 190 115 170 170 Z" fill="#FFFDF9" stroke="#EFE4D2" stroke-width="1.2"/>
          <path d="M170 40 L170 120" stroke="#ECE0CD" stroke-width="0.8" stroke-linecap="round"/>
        </g>
        <!-- Yaprak 10 (270°) -->
        <g class="petal" data-index="9" style="--rot: 270deg;" transform="rotate(270 170 170)">
          <path d="M170 170 C150 115 146 50 170 12 C194 50 190 115 170 170 Z" fill="#FFFDF9" stroke="#EFE4D2" stroke-width="1.2"/>
          <path d="M170 40 L170 120" stroke="#ECE0CD" stroke-width="0.8" stroke-linecap="round"/>
        </g>
        <!-- Yaprak 11 (300°) -->
        <g class="petal" data-index="10" style="--rot: 300deg;" transform="rotate(300 170 170)">
          <path d="M170 170 C150 115 146 50 170 12 C194 50 190 115 170 170 Z" fill="#FFFDF9" stroke="#EFE4D2" stroke-width="1.2"/>
          <path d="M170 40 L170 120" stroke="#ECE0CD" stroke-width="0.8" stroke-linecap="round"/>
        </g>
        <!-- Yaprak 12 (330°) -->
        <g class="petal" data-index="11" style="--rot: 330deg;" transform="rotate(330 170 170)">
          <path d="M170 170 C150 115 146 50 170 12 C194 50 190 115 170 170 Z" fill="#FFFDF9" stroke="#EFE4D2" stroke-width="1.2"/>
          <path d="M170 40 L170 120" stroke="#ECE0CD" stroke-width="0.8" stroke-linecap="round"/>
        </g>
      </g>

      <!-- Altın Papatya Merkezi (Göbek: z-index ile yaprakların üstünde, dikişsiz örtüşme) -->
      <g class="daisy-center" id="daisyCenter">
        <!-- Dış yumuşak gölge ve göbek dairesi -->
        <circle cx="170" cy="170" r="48" fill="#F4C95D" filter="drop-shadow(0 2px 6px rgba(61, 53, 46, 0.14))"/>
        <circle cx="170" cy="170" r="44" fill="#F8D375"/>
        <circle cx="170" cy="170" r="40" fill="#F4C95D" opacity="0.9"/>
        <!-- Doğal papatya merkezi benekleri -->
        <circle cx="158" cy="158" r="3.5" fill="#DEAB3E" opacity="0.6"/>
        <circle cx="182" cy="158" r="3.2" fill="#DEAB3E" opacity="0.55"/>
        <circle cx="160" cy="178" r="3.5" fill="#DEAB3E" opacity="0.55"/>
        <circle cx="180" cy="178" r="3.2" fill="#DEAB3E" opacity="0.6"/>
        <circle cx="170" cy="168" r="4.2" fill="#DEAB3E" opacity="0.7"/>
      </g>
    </svg>

    <!-- Polaroid Fotoğraf Çerçevesi (Merkezden Büyüyen Sürpriz) -->
    <div class="photo-reveal-container" id="photoRevealContainer">
      <div class="polaroid-frame">
        <div class="polaroid-img-wrap">
          <img src="supriz.jpg" alt="Biz" class="polaroid-photo" id="surprisePhoto" onerror="handlePhotoFallback(this)">
        </div>
      </div>
    </div>
  </div>

  <!-- Kalan Yaprak Bilgisi -->
  <div class="petal-counter" id="petalCounter">Kalan yaprak: 12</div>

  <!-- Bitiş Sonuç Kartı (Fotoğrafın hemen altında beliren alan) -->
  <div class="result-box" id="resultBox">
    <div class="result-text">Sonuç hep aynı: Seni çok seviyorum 🌼</div>
    <a href="index.html" class="back-btn" style="margin-top: 0.4rem;">← Geri Dön</a>
  </div>

  <!-- Oyun Esnasında Alt Buton -->
  <div class="bottom-actions" id="initialActions">
    <a href="index.html" class="back-btn">← Geri Dön</a>
  </div>

  <script>
    // Fotoğraf yükleme fallback yönetimi (supriz.jpg -> supriz.jpeg -> supriz.png)
    function handlePhotoFallback(img) {
      if (!img.dataset.triedJpeg && (img.src.includes('supriz.jpg') || img.src.endsWith('supriz.jpg'))) {
        img.dataset.triedJpeg = 'true';
        img.src = 'supriz.jpeg';
      } else if (!img.dataset.triedPng) {
        img.dataset.triedPng = 'true';
        img.src = 'supriz.png';
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      // 12 yaprak için 12 tatlı fal mesajı
      const messages = [
        'Seni her şeyden çok seviyorum 🤍',
        'İyi olman benim için dünyalara bedel',
        'Gülüşün en sevdiğim manzara',
        'Aklım da kalbim de hep seninle',
        'Yanına geleceğim günü iple çekiyorum',
        'İyi ki hayatımdasın',
        'Sen benim en kıymetlimsin',
        'Her şey çok güzel olacak',
        'Seninle geçen her an çok değerli',
        'Gözlerinin içi hep böyle parlasın',
        'Kalbim daima seninle atıyor',
        'Seni dünyalar kadar çok seviyorum 🌼'
      ];

      const petals = document.querySelectorAll('.petal');
      const fortuneMessage = document.getElementById('fortuneMessage');
      const petalCounter = document.getElementById('petalCounter');
      const daisyCenter = document.getElementById('daisyCenter');
      const resultBox = document.getElementById('resultBox');
      const instructionText = document.getElementById('instructionText');
      const heartCanvas = document.getElementById('heartCanvas');

      let remainingPetals = petals.length;
      let messageIndex = 0;

      petals.forEach(petal => {
        function pluckPetal(e) {
          if (petal.classList.contains('falling')) return;
          if (e.type === 'touchstart') e.preventDefault();

          // Kopma animasyonu başlat
          petal.classList.add('falling');
          remainingPetals--;

          // Mesajı güncelle
          const currentMsg = messages[messageIndex % messages.length];
          messageIndex++;
          
          fortuneMessage.style.animation = 'none';
          fortuneMessage.offsetHeight; // trigger reflow
          fortuneMessage.textContent = currentMsg;
          fortuneMessage.style.animation = 'popIn 0.45s cubic-bezier(0.34, 1.56, 0.64, 1)';

          // Sayacı güncelle
          if (remainingPetals > 0) {
            petalCounter.textContent = `Kalan yaprak: ${remainingPetals}`;
          } else {
            petalCounter.style.display = 'none';
            allPetalsPlucked();
          }
        }

        petal.addEventListener('click', pluckPetal);
        petal.addEventListener('touchstart', pluckPetal, { passive: false });
      });

      // Tüm yapraklar koparıldığında
      function allPetalsPlucked() {
        // Sarı merkeze ilk parlama efekti ver
        daisyCenter.classList.add('golden-glow');

        // Kısa bir gecikmeyle (0.5 saniye sonra) sarı göbek fotoğrafa dönüşsün
        setTimeout(() => {
          // Fal mesaj alanını yumuşakça gizle
          if (fortuneMessage && fortuneMessage.parentElement) {
            fortuneMessage.parentElement.style.transition = 'opacity 0.4s ease';
            fortuneMessage.parentElement.style.opacity = '0';
            setTimeout(() => {
              fortuneMessage.parentElement.style.display = 'none';
            }, 400);
          }

          // Sarı göbek büyüyerek kaybolsun
          daisyCenter.classList.remove('golden-glow');
          daisyCenter.classList.add('zoom-grow');

          // Polaroid fotoğraf çerçevesi merkezden açılarak belirsin
          const photoContainer = document.getElementById('photoRevealContainer');
          if (photoContainer) {
            photoContainer.classList.add('revealed');
          }

          // Pembe uçuşan kalpler animasyonunu başlat
          startHeartRain();

          // Fotoğrafın hemen altında final mesajı ve Geri Dön butonu belirsin
          setTimeout(() => {
            const initialActions = document.getElementById('initialActions');
            if (initialActions) initialActions.style.display = 'none';
            resultBox.classList.add('show');
          }, 350);
        }, 500);
      }

      // Uçuşan Kalpler Yağmuru
      function startHeartRain() {
        const canvas = heartCanvas;
        const ctx = canvas.getContext('2d');
        canvas.classList.add('active');

        function resize() {
          canvas.width = window.innerWidth;
          canvas.height = window.innerHeight;
        }
        resize();
        window.addEventListener('resize', resize);

        const hearts = [];
        const heartCount = 36;
        const symbols = ['💖', '💕', '💗', '🌸', '✨'];

        for (let i = 0; i < heartCount; i++) {
          hearts.push({
            x: Math.random() * canvas.width,
            y: canvas.height + Math.random() * 80,
            size: Math.random() * 16 + 14,
            speedY: Math.random() * 1.8 + 1.2,
            speedX: Math.random() * 1 - 0.5,
            opacity: Math.random() * 0.5 + 0.5,
            symbol: symbols[Math.floor(Math.random() * symbols.length)]
          });
        }

        let running = true;
        function animate() {
          if (!running) return;
          ctx.clearRect(0, 0, canvas.width, canvas.height);

          hearts.forEach(h => {
            h.y -= h.speedY;
            h.x += h.speedX;
            if (h.y < -30) {
              h.y = canvas.height + 20;
              h.x = Math.random() * canvas.width;
            }

            ctx.save();
            ctx.globalAlpha = h.opacity;
            ctx.font = `${h.size}px sans-serif`;
            ctx.fillText(h.symbol, h.x, h.y);
            ctx.restore();
          });

          requestAnimationFrame(animate);
        }
        animate();
      }
    });
  </script>
</body>
</html>
